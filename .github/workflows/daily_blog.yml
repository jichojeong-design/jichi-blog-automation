name: 지치 블로그 매일 아침 무인 자동 포스팅

on:
  schedule:
    # UTC 00:00 = 한국 시간(KST) 매일 아침 09:00 정각!
    - cron: '0 0 * * *'
  # GitHub 사이트에서 사장님이 원하실 때 언제든 '수동 실행'도 가능하도록 설정
  workflow_dispatch:

jobs:
  run-daily-blog:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow playwright schedule python-dotenv
          python -m playwright install --with-deps chromium

      - name: 4. 09:00 KST 지치 블로그 순차 자동 발행 가동
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.GPT_API_KEY }}
          GPT_API_KEY: ${{ secrets.GPT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_PW: ${{ secrets.NAVER_PW }}
        run: |
          python daily_scheduler.py --cloud-mode
